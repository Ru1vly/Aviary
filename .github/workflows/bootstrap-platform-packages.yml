name: Bootstrap Platform Packages

# Manual recovery path for republishing the five platform binary packages
# outside a tagged release. Normal releases publish them from release.yml.
# Keep the input version aligned with the root release tag that will consume them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unused version for recovery publishing; use the version planned for the root release tag'
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build-rust-matrix:
    name: Build TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tui-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tui-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-windows-amd64.exe
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - name: Install cross (for ARM builds)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      # See release.yml's build-rust-matrix job for why QEMU registration
      # and the exact `--bin` selection below are needed -- this mirrors it
      # exactly, just triggered manually instead of by a tag.
      - name: Install QEMU user-mode emulation (for cross-arch smoke test)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --locked --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      - name: Rename binaries
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.fast_binary_name }}" "${{ matrix.fast_artifact_name }}"
        shell: bash
      - name: Smoke test binary runs on this platform
        run: node scripts/smoke-test-binary.js "./${{ matrix.artifact_name }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fast_artifact_name }}
          path: ${{ matrix.fast_artifact_name }}

  publish-platform-packages:
    name: Publish platform package (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: [build-rust-matrix]
    strategy:
      matrix:
        include:
          - dir: linux-x64
            artifact_name: tui-linux-amd64
            fast_artifact_name: aviary-fast-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: linux-arm64
            artifact_name: tui-linux-arm64
            fast_artifact_name: aviary-fast-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-x64
            artifact_name: tui-macos-amd64
            fast_artifact_name: aviary-fast-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-arm64
            artifact_name: tui-macos-arm64
            fast_artifact_name: aviary-fast-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: win32-x64
            artifact_name: tui-windows-amd64.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with: { name: '${{ matrix.artifact_name }}', path: 'npm/${{ matrix.dir }}' }
      - uses: actions/download-artifact@v4
        with: { name: '${{ matrix.fast_artifact_name }}', path: 'npm/${{ matrix.dir }}' }
      - name: Rename binaries and set executable bit
        working-directory: npm/${{ matrix.dir }}
        run: |
          mv "${{ matrix.artifact_name }}" "${{ matrix.binary_name }}"
          mv "${{ matrix.fast_artifact_name }}" "${{ matrix.fast_binary_name }}"
          chmod +x "${{ matrix.binary_name }}" "${{ matrix.fast_binary_name }}" || true
      # --allow-same-version supports rerunning the recovery workflow for a
      # package version already present in its committed manifest.
      - name: Set version
        working-directory: npm/${{ matrix.dir }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
      # Recovery runs may find that another platform or a prior attempt has
      # already published this package version. npm versions are immutable,
      # so skip only the packages already present and publish the rest.
      - name: Check if this version is already published
        id: check
        working-directory: npm/${{ matrix.dir }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "Already published, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: npm/${{ matrix.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
