name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2am
  push:
    branches: [main, master]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
        continue-on-error: true
      - name: Generate Node.js SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file bom-node.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-node
          path: bom-node.json

  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - run: cargo install cargo-audit cargo-cyclonedx
      # Run from the repo root: `tui` and `engine` share one workspace
      # Cargo.lock (see /Cargo.toml), so this already audits both members —
      # no need to run it once per member.
      - run: cargo audit
        continue-on-error: true
      # `-all` is not a real flag (clap parses it as bundled short flags
      # `-a -l -l` and errors on the unknown `-l`) — `--all` is the default
      # behavior anyway, so it's dropped rather than corrected to `--all`.
      # Run from the repo root so both workspace members are covered; it
      # emits one file per member (`tui/tui.cdx.json`,
      # `engine/aviary-engine.cdx.json`), not a single `bom.json`.
      - name: Generate Rust SBOM
        run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-rust
          path: |
            tui/*.cdx.json
            engine/*.cdx.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
