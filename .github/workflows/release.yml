name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: tests must pass before anything publishes ─────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:coverage

  # ── Cross-compile Rust TUI + fast-path engine binary ────────
  # Each artifact bundles both `tui` and `aviary-fast` (from the
  # aviary-engine package — engine/src/bin/aviary_fast.rs) side by side:
  # the TUI's --fast mode resolves aviary-fast by looking next to its own
  # binary (see tui/src/main.rs), so someone downloading just the TUI
  # binary from a GitHub release — not installing via npm, where
  # scripts/build-tui.js already bundles both into dist/ — needs both
  # here too, or --fast silently has nothing to spawn.
  build-rust-matrix:
    name: Build TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tui-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tui-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-windows-amd64
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - name: Install cross (for ARM builds)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      # --bin aviary-fast selects the binary *target* (engine/src/bin/aviary_fast.rs)
      # from the aviary-engine package — "aviary-fast" is a binary name, not
      # a package name, so `--package aviary-fast` alone wouldn't resolve.
      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      # `tui` is a member of the root Cargo workspace (see /Cargo.toml), so
      # even when built from within `tui/`, cargo/cross write output to
      # `<repo>/target/<triple>/release/`, not `tui/target/...` — verified
      # locally (cargo build --release --target x86_64-unknown-linux-gnu
      # from tui/ produces ../target/x86_64-unknown-linux-gnu/release/tui).
      - name: Rename binaries
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.fast_binary_name }}" "${{ matrix.fast_artifact_name }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fast_artifact_name }}
          path: ${{ matrix.fast_artifact_name }}

  # ── Build & Publish npm package ────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # `pnpm run build` also builds the Rust TUI bundled into the package
      # (see scripts/build-tui.js) — this runner needs a Rust toolchain too.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Set version from tag
        run: npm version ${{ github.ref_name }} --no-git-tag-version
      - name: Verify package contents (dry run)
        run: pnpm publish --dry-run --access public --no-git-checks
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Build & Push Docker Image ───────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ───────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rust-matrix, publish-npm]
    steps:
      - uses: actions/checkout@v4
        with:
          # Changelog generation below needs prior tags to diff against —
          # the default shallow (depth-1) checkout only fetches the tag
          # that triggered this run, so `git tag`/`git log <prev>..<tag>`
          # would never find a previous release.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          merge-multiple: true
          path: release-artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: aviary-fast-*
          merge-multiple: true
          path: release-artifacts/
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges | head -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install -g aviary
            ```

            ## TUI Binaries
            Download the pre-compiled TUI binary for your platform from the assets below.
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
