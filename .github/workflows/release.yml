name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: tests must pass before anything publishes ─────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Reject an already-published root package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@ru1vly/aviary@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@ru1vly/aviary@$VERSION is already published; choose a new release tag."
            exit 1
          fi
      - run: pnpm audit --audit-level moderate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build:ts
      - run: pnpm run check:xlsx-bundle
      - run: pnpm run check:cli-docs
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:coverage

  # ── Cross-compile Rust TUI + fast-path engine binary ────────
  # Each artifact bundles both `tui` and `aviary-fast` (from the
  # aviary-engine package — engine/src/bin/aviary_fast.rs) side by side:
  # the TUI's --fast mode resolves aviary-fast by looking next to its own
  # binary (see tui/src/main.rs), so someone downloading just the TUI
  # binary from a GitHub release — not installing via npm, where
  # scripts/build-tui.js already bundles both into dist/ — needs both
  # here too, or --fast silently has nothing to spawn.
  build-rust-matrix:
    name: Build TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tui-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tui-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
            fast_artifact_name: aviary-fast-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-windows-amd64.exe
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - name: Install cross (for ARM builds)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      # `cross build` runs the aarch64 binary *inside* its own Docker
      # container via QEMU, but that container exits once the build is
      # done -- registering binfmt_misc on the host here too is what lets
      # the smoke-test step below actually execute the resulting aarch64
      # binary directly on this x86_64 runner afterward.
      - name: Install QEMU user-mode emulation (for cross-arch smoke test)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      # --bin aviary-fast selects the binary *target* (engine/src/bin/aviary_fast.rs)
      # from the aviary-engine package — "aviary-fast" is a binary name, not
      # a package name, so `--package aviary-fast` alone wouldn't resolve.
      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --locked --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} --package tui --package aviary-engine --bin tui --bin aviary-fast
        working-directory: tui
      # `tui` is a member of the root Cargo workspace (see /Cargo.toml), so
      # even when built from within `tui/`, cargo/cross write output to
      # `<repo>/target/<triple>/release/`, not `tui/target/...` — verified
      # locally (cargo build --release --target x86_64-unknown-linux-gnu
      # from tui/ produces ../target/x86_64-unknown-linux-gnu/release/tui).
      - name: Rename binaries
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.fast_binary_name }}" "${{ matrix.fast_artifact_name }}"
        shell: bash
      # Runs the just-built binary once on its own native (or, for the
      # cross target, QEMU-emulated) runner. CI has no real TTY so the TUI
      # is expected to fail once it tries to open one -- this only checks
      # that failure is the TUI's own runtime error, not the OS refusing
      # to load the binary at all (wrong target, missing shared libs).
      - name: Smoke test binary runs on this platform
        run: node scripts/smoke-test-binary.js "./${{ matrix.artifact_name }}"
        shell: bash
      - name: Smoke test fast engine help without network access
        run: node scripts/smoke-test-fast-binary.js "./${{ matrix.fast_artifact_name }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fast_artifact_name }}
          path: ${{ matrix.fast_artifact_name }}

  # ── Publish per-platform binary packages ────────────────────
  # Each npm/<platform>/ package bundles just the `tui` + `aviary-fast`
  # binaries for one os/cpu pair, restricted via package.json's "os"/"cpu"
  # fields so npm only installs the one matching the current machine. The
  # main package depends on all five as optionalDependencies (see below) —
  # this has to publish first so that dependency resolves immediately for
  # anyone installing the main package right after release.
  publish-platform-packages:
    name: Publish platform package (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: [build-rust-matrix]
    env:
      NODE_VERSION: '24'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - dir: linux-x64
            artifact_name: tui-linux-amd64
            fast_artifact_name: aviary-fast-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: linux-arm64
            artifact_name: tui-linux-arm64
            fast_artifact_name: aviary-fast-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-x64
            artifact_name: tui-macos-amd64
            fast_artifact_name: aviary-fast-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-arm64
            artifact_name: tui-macos-arm64
            fast_artifact_name: aviary-fast-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: win32-x64
            artifact_name: tui-windows-amd64.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with: { name: '${{ matrix.artifact_name }}', path: 'npm/${{ matrix.dir }}' }
      - uses: actions/download-artifact@v4
        with: { name: '${{ matrix.fast_artifact_name }}', path: 'npm/${{ matrix.dir }}' }
      - name: Rename binaries and set executable bit
        working-directory: npm/${{ matrix.dir }}
        run: |
          mv "${{ matrix.artifact_name }}" "${{ matrix.binary_name }}"
          mv "${{ matrix.fast_artifact_name }}" "${{ matrix.fast_binary_name }}"
          chmod +x "${{ matrix.binary_name }}" "${{ matrix.fast_binary_name }}" || true
      - name: Set version from tag
        working-directory: npm/${{ matrix.dir }}
        run: npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      # Idempotency guard: the manual recovery workflow may already have
      # published this version. npm rejects republishing an existing version,
      # so skip it when the package is already available.
      - name: Check if this version is already published
        id: check
        working-directory: npm/${{ matrix.dir }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "Already published, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: npm/${{ matrix.dir }}
        run: npm publish --access public

  # ── Build & Publish npm package ────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, publish-platform-packages]
    env:
      NODE_VERSION: '24'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # TS only — the native TUI binary now ships via the per-platform
      # optionalDependencies published above, not bundled into dist/.
      - run: pnpm run build:ts
      - run: pnpm run check:xlsx-bundle
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Set version from tag
        run: |
          npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = version;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const specPath = 'docs/openapi.yaml';
            const spec = fs.readFileSync(specPath, 'utf8');
            const versionedSpec = spec.replace(/^  version: .+$/m, `  version: ${version}`);
            if (versionedSpec === spec && !spec.includes(`  version: ${version}`)) {
              throw new Error('OpenAPI document is missing its info.version field.');
            }
            fs.writeFileSync(specPath, versionedSpec);
          "
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Verify package contents (dry run)
        run: npm publish --dry-run --access public
      - name: Publish to npm
        run: npm publish --access public

  # ── Build & Push Docker Image ───────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, publish-npm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ───────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rust-matrix, publish-npm, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Changelog generation below needs prior tags to diff against —
          # the default shallow (depth-1) checkout only fetches the tag
          # that triggered this run, so `git tag`/`git log <prev>..<tag>`
          # would never find a previous release.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          merge-multiple: true
          path: release-artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: aviary-fast-*
          merge-multiple: true
          path: release-artifacts/
      - name: Generate SHA-256 checksums
        run: |
          cd release-artifacts
          sha256sum -- * > SHA256SUMS
      - name: Generate release notes
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          CHANGELOG=$(awk -v section="## $VERSION" '
            $0 == section { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if ! grep -q '[^[:space:]]' <<<"$CHANGELOG"; then
            TAG="$RELEASE_TAG"
            PREV_TAG=$(git tag --sort=-version:refname | grep -F -x -v -- "$TAG" | head -1)
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges)
            else
              CHANGELOG=$(git log --oneline --no-merges | head -20)
            fi
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install -g @ru1vly/aviary
            ```

            ## TUI Binaries
            Download the pre-compiled TUI binary for your platform from the assets below.
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
