name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: tests must pass before anything publishes ─────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Reject an already-published root package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@ru1vly/aviary@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@ru1vly/aviary@$VERSION is already published; choose a new release tag."
            exit 1
          fi
      - run: pnpm audit --audit-level moderate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build:ts
      - run: pnpm run check:xlsx-bundle
      - run: pnpm run check:cli-docs
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:coverage
      - name: Verify unpublished root candidate before publishing
        shell: bash
        run: |
          pnpm run pack:candidate -- "${GITHUB_REF_NAME#v}" reports/release-candidates/tag
          node scripts/check-release-candidate.js "reports/release-candidates/tag/ru1vly-aviary-${GITHUB_REF_NAME#v}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-root-package
          path: reports/release-candidates/tag/

  # ── Cross-compile Rust TUI + fast-path engine binary ────────
  # Each artifact bundles both `tui` and `aviary-fast` (from the
  # aviary-engine package — engine/src/bin/aviary_fast.rs) side by side:
  # the TUI's --fast mode resolves aviary-fast by looking next to its own
  # binary (see tui/src/main.rs), so someone downloading just the TUI
  # binary from a GitHub release — not installing via npm, where
  # scripts/build-tui.js already bundles both into dist/ — needs both
  # here too, or --fast silently has nothing to spawn.
  build-rust-matrix:
    name: Native artifacts
    needs: [test]
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ github.ref_name }}

  # ── Publish per-platform binary packages ────────────────────
  # Each npm/<platform>/ package bundles just the `tui` + `aviary-fast`
  # binaries for one os/cpu pair, restricted via package.json's "os"/"cpu"
  # fields so npm only installs the one matching the current machine. The
  # main package depends on all five as optionalDependencies (see below) —
  # this has to publish first so that dependency resolves immediately for
  # anyone installing the main package right after release.
  publish-platform-packages:
    name: Publish platform package (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    needs: [build-rust-matrix]
    env:
      NODE_VERSION: '24'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - dir: linux-x64
            artifact_name: tui-linux-amd64
            fast_artifact_name: aviary-fast-linux-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: linux-arm64
            artifact_name: tui-linux-arm64
            fast_artifact_name: aviary-fast-linux-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-x64
            artifact_name: tui-macos-amd64
            fast_artifact_name: aviary-fast-macos-amd64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: darwin-arm64
            artifact_name: tui-macos-arm64
            fast_artifact_name: aviary-fast-macos-arm64
            binary_name: tui
            fast_binary_name: aviary-fast
          - dir: win32-x64
            artifact_name: tui-windows-amd64.exe
            fast_artifact_name: aviary-fast-windows-amd64.exe
            binary_name: tui.exe
            fast_binary_name: aviary-fast.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: native-package-${{ matrix.dir }}
          path: reports/native-publish/${{ matrix.dir }}/
      - name: Verify checked native archive
        working-directory: reports/native-publish/${{ matrix.dir }}
        run: sha256sum -c SHA256SUMS
      # Idempotency guard: the manual recovery workflow may already have
      # published this version. npm rejects republishing an existing version,
      # so skip it when the package is already available.
      - name: Check if this version is already published
        id: check
        working-directory: reports/native-publish/${{ matrix.dir }}
        run: |
          PKG=$(node -p "require('./pack-manifest.json').name")
          VERSION=$(node -p "require('./pack-manifest.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "Already published, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: reports/native-publish/${{ matrix.dir }}
        run: npm publish ./*.tgz --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Build & Publish npm package ────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    needs: [test, publish-platform-packages]
    env:
      NODE_VERSION: '24'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: verified-root-package
          path: reports/root-publish/
      - name: Verify checked root archive
        working-directory: reports/root-publish
        run: sha256sum -c SHA256SUMS
      - name: Verify package contents (dry run)
        working-directory: reports/root-publish
        run: npm publish ./*.tgz --dry-run --access public --tag latest
      - name: Publish to npm
        working-directory: reports/root-publish
        run: npm publish ./*.tgz --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Build & Push Docker Image ───────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-24.04
    needs: [test, publish-npm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Align container dependencies with the published release
        run: |
          node scripts/set-release-version.js "$RELEASE_TAG"
          pnpm install --lockfile-only --ignore-scripts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ───────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-rust-matrix, publish-npm, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Changelog generation below needs prior tags to diff against —
          # the default shallow (depth-1) checkout only fetches the tag
          # that triggered this run, so `git tag`/`git log <prev>..<tag>`
          # would never find a previous release.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          merge-multiple: true
          path: release-artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: aviary-fast-*
          merge-multiple: true
          path: release-artifacts/
      - name: Generate SHA-256 checksums
        run: |
          cd release-artifacts
          sha256sum -- * > SHA256SUMS
      - name: Generate release notes
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          CHANGELOG=$(awk -v section="## $VERSION" '
            $0 == section { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if ! grep -q '[^[:space:]]' <<<"$CHANGELOG"; then
            TAG="$RELEASE_TAG"
            PREV_TAG=$(git tag --sort=-version:refname | grep -F -x -v -- "$TAG" | head -1)
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges)
            else
              CHANGELOG=$(git log --oneline --no-merges | head -20)
            fi
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install -g @ru1vly/aviary
            ```

            ## TUI Binaries
            Download the pre-compiled TUI binary for your platform from the assets below.
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
