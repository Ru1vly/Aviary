name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Cross-compile Rust TUI ─────────────────────────────────
  build-rust-matrix:
    name: Build TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tui-linux-amd64
            binary_name: tui
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tui-linux-arm64
            binary_name: tui
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-macos-amd64
            binary_name: tui
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-macos-arm64
            binary_name: tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-windows-amd64
            binary_name: tui.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: './tui -> target' }
      - name: Install cross (for ARM builds)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: tui
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
        working-directory: tui
      - name: Rename binary
        run: |
          cp tui/target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.artifact_name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ── Build & Publish npm package ────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Set version from tag
        run: npm version ${{ github.ref_name }} --no-git-tag-version
      - name: Publish (dry-run on non-main tags)
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Build & Push Docker Image ───────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ───────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rust-matrix, publish-npm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          merge-multiple: true
          path: release-artifacts/
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges | head -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install -g e2e-seo
            ```

            ## TUI Binaries
            Download the pre-compiled TUI binary for your platform from the assets below.
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
