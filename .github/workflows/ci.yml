name: CI — Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  RUST_VERSION: 'stable'

# `--frozen-lockfile` is normally what we want (fails fast if someone edited
# package.json without updating pnpm-lock.yaml), but package.json's
# optionalDependencies point at the five @ru1vly/aviary-<platform> TUI
# binary packages, which don't exist on the npm registry until the release
# workflow publishes them for the first time -- pnpm can't lock a package it
# can't resolve, so a frozen install here fails on every commit until that
# first publish happens. Every `pnpm install` below uses `--no-frozen-lockfile`
# for this reason. Once v1.0.0 has published those platform packages for
# real, regenerate and commit pnpm-lock.yaml (it will then contain real
# resolutions for them) and switch this back to `--frozen-lockfile`.
jobs:
  # ── Lint & Type Check ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit

  # ── Unit Tests ──────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:unit
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Integration Tests ───────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:integration
        timeout-minutes: 10

  # ── E2E Tests ────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:e2e
        timeout-minutes: 10

  # ── Rust TUI Build ─────────────────────────────────────────
  build-rust:
    name: Build Rust TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      # `tui` is a member of the root Cargo workspace (see /Cargo.toml), so
      # cargo writes output to `<repo>/target`, not `tui/target` — build by
      # package name from the repo root rather than cd-ing into `tui/`.
      - run: cargo build --release -p tui
      - uses: actions/upload-artifact@v4
        with:
          name: tui-linux-amd64
          path: target/release/tui
          retention-days: 7

  # ── TypeScript Build ────────────────────────────────────────
  build-ts:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:ts
      - uses: actions/upload-artifact@v4
        with:
          name: dist-js
          path: dist/
          retention-days: 7
