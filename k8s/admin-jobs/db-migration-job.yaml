apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-seo-db-migration
  namespace: e2e-seo
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: e2e-seo
        component: db-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: e2e-seo-app:latest
        imagePullPolicy: IfNotPresent
        command: ["npm", "run", "db:migrate"]
        envFrom:
        - configMapRef:
            name: e2e-seo-config
        - secretRef:
            name: e2e-seo-secrets
