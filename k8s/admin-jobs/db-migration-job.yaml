apiVersion: batch/v1
kind: Job
metadata:
  name: aviary-db-migration
  namespace: aviary
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: aviary
        component: db-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: aviary-app:latest
        imagePullPolicy: IfNotPresent
        command: ["npm", "run", "db:migrate"]
        envFrom:
        - configMapRef:
            name: aviary-config
        - secretRef:
            name: aviary-secrets
