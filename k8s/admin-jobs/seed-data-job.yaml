apiVersion: batch/v1
kind: Job
metadata:
  name: aviary-seed-data
  namespace: aviary
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: aviary
        component: seed-data
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: aviary-app:latest
        imagePullPolicy: IfNotPresent
        command: ["npm", "run", "db:seed"]
        envFrom:
        - configMapRef:
            name: aviary-config
        - secretRef:
            name: aviary-secrets
