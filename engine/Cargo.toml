[package]
name = "aviary-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aviary-fast"
path = "src/bin/aviary_fast.rs"

[dependencies]
# default-tls (the crate default) links native OpenSSL via openssl-sys,
# whose build script needs a target-arch OpenSSL install -- cross's Docker
# images don't ship one, so cross-compiling for aarch64-unknown-linux-gnu
# fails there. rustls-tls is a pure-Rust TLS stack with no native
# dependency, so it cross-compiles for every target build-rust-matrix uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "charset", "http2"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
url = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry-prometheus = "0.32.0"
opentelemetry_sdk = "0.32.1"
rmp-serde = "1.3.1"
uuid = { version = "1.23.4", features = ["v4"] }
prometheus = "0.14.0"
tempfile = "3.27.0"
